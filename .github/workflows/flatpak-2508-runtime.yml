name: ARM64 Flatpak package runtime checks
on:
  push:
    branches: [validation/flatpak-arm64-2508-runtime]
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pypilot/pypilot
          ref: a876adce5fb2b6aff6374fb60794bf9aea776b07
          path: pypilot-server
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45495865940
          name: pypilot-arm64-flatpak-2508
          path: package
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xdotool openbox python3-pil python3-dev swig g++
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.opencpn.OpenCPN
          cd pypilot-server/pypilot/linebuffer
          swig -c++ -python linebuffer.i
          g++ -shared -fPIC $(/usr/bin/python3-config --includes) linebuffer.cpp linebuffer_wrap.cxx -o _linebuffer.so
      - name: Compare old and new imports and exercise the plugin
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/test-source-commit.txt
          git -C pypilot-server rev-parse HEAD > evidence/server-source-commit.txt
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24' bash ci/runtime-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pypilot-arm64-runtime-evidence
          path: evidence/
          retention-days: 14
